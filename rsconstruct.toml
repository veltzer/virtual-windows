# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── shell ───────────────────────────────────────────────────────────────────

# shellcheck every script in the repo root. --external-sources lets it follow
# the `source config.sh` at the top of each script. .shellcheckrc is a tracked
# dependency by default.
[processor.shellcheck]
src_files = ["config.sh", "create_vm.sh", "delete_vm.sh", "download_iso.sh", "download_virtio.sh", "install_prereqs.sh", "show_credentials.sh", "start_vm.sh", "stop_vm.sh", "verify_iso.sh"]
src_extensions = [".sh"]
args = ["--shell=bash", "--external-sources"]

# ─── python ──────────────────────────────────────────────────────────────────

# the one python script lives in the repo root next to the shell scripts;
# src_files names it explicitly rather than sweeping "." so a future .venv or
# scratch file cannot leak into the lint set.
[processor.ruff]
src_files = ["rpm_file_sha256.py"]

[processor.pylint]
src_files = ["rpm_file_sha256.py"]

[processor.mypy]
src_files = ["rpm_file_sha256.py"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]

# ─── toml ────────────────────────────────────────────────────────────────────

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── yaml ────────────────────────────────────────────────────────────────────

# yamllint every yaml file; the only ones here are under .github. The shared
# .yamllint.yaml is a tracked dependency by default.
[processor.yamllint]
src_dirs = [".github"]

# ─── ci ──────────────────────────────────────────────────────────────────────

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
